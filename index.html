<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="موادك الدراسية — ملفات الأسابيع">
<link rel="icon" href="data:,">
<title>المواد الدراسية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#141821; --muted:#5d6675; --border:#e2e6ef;
  --primary:#1f6feb; --primary-weak:#e9f1ff; --danger:#d64545; --ok:#1f9254;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 10px 28px rgba(16,24,40,.07);
  --radius:14px; --radius-sm:10px; --blur:none; --glow:none;
  --ring:0 0 0 4px rgba(31,111,235,.16);
  --ring-soft:0 0 0 1px rgba(31,111,235,.18), 0 14px 34px rgba(16,24,40,.09);
  --anim:1;
}
html[data-theme="dark"]{
  --bg:#0d1014; --card:#151a21; --text:#e9edf3; --muted:#96a0b0; --border:#242b35;
  --primary:#5c9cff; --primary-weak:#15243d; --danger:#ff6f6f; --ok:#3ec27f;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.4);
  --ring:0 0 0 4px rgba(92,156,255,.2);
  --ring-soft:0 0 0 1px rgba(92,156,255,.26), 0 14px 34px rgba(0,0,0,.5);
}

/* ===== storm: lightning + dark ===== */
html[data-style="storm"]{
  --bg:#0a0e17; --card:#131a28; --text:#e7edf8; --muted:#8c9ab5; --border:#222d42;
  --primary:#ffd83d; --primary-weak:#2a2612; --danger:#ff6b6b; --ok:#4ee39a;
  --shadow:0 12px 30px rgba(0,0,0,.55);
  --ring:0 0 0 4px rgba(255,216,61,.22);
  --ring-soft:0 0 0 1px rgba(255,216,61,.3), 0 16px 38px rgba(0,0,0,.6);
  --radius:16px; --radius-sm:10px;
  --glow:0 0 22px rgba(255,216,61,.18);
}
html[data-style="storm"] body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 78% -8%,rgba(255,216,61,.10),transparent 62%),
             radial-gradient(700px 420px at 12% 108%,rgba(90,140,255,.12),transparent 62%);
  animation:stormPulse 7s ease-in-out infinite;
}
html[data-style="storm"] .flash{
  position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,216,61,.16));
}
html[data-style="storm"] .flash.go{animation:flash 620ms ease-out}
@keyframes stormPulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes flash{0%{opacity:0}6%{opacity:.85}14%{opacity:.1}22%{opacity:.6}32%{opacity:0}100%{opacity:0}}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh;
  -webkit-text-size-adjust:100%;
  background-attachment:fixed;
}
body>*{position:relative;z-index:1}

/* starfield + falling meteors (JS-driven, both themes) */
#sky{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  opacity:0;transition:opacity .6s ease;
}
html[data-theme="dark"] #sky{opacity:1}
html[data-theme="light"] #sky{opacity:.85}

button{font-family:inherit;cursor:pointer}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}

header{
  position:sticky;top:0;z-index:20;
  background:var(--card);border-bottom:1px solid var(--border);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
}
.hbar{display:flex;align-items:center;gap:10px;padding:12px 0}
.hbar h1{font-size:1.05rem;margin:0;font-weight:700;flex:1;min-width:0}

.icon-btn{
  border:1px solid var(--border);background:var(--card);color:var(--text);
  border-radius:var(--radius-sm);padding:9px 13px;font-size:.85rem;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;
  box-shadow:var(--glow);
  transition:transform .12s ease, background .18s ease, color .18s ease, box-shadow .18s ease;
}
.icon-btn:hover{background:var(--primary-weak);color:var(--primary);border-color:var(--primary)}
.back{display:none}

main{padding:20px 0 80px}
.sub-title{color:var(--muted);font-size:.9rem;margin:0 0 16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}

.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;text-align:right;box-shadow:var(--shadow),var(--glow);
  display:flex;align-items:center;gap:12px;width:100%;
  color:var(--text);font-size:1rem;font-weight:600;
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  position:relative;overflow:hidden;
  transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .22s ease, border-color .22s ease;
  animation:riseIn .42s cubic-bezier(.2,.7,.3,1) both;
}
.card::after{
  content:"";position:absolute;inset-inline:0;top:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
  opacity:.75;
}
.card:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:var(--shadow),var(--glow),var(--ring-soft)}
.card:active{transform:translateY(-1px) scale(.985)}
.card .dot{
  width:4px;height:34px;flex:none;border-radius:99px;
  background:linear-gradient(180deg,var(--primary),transparent);
  opacity:.9;
}
.card .cnt{margin-inline-start:auto;color:var(--muted);font-size:.78rem;font-weight:500;letter-spacing:.1px}

/* "new since your last visit" dot on a subject card */
.card .newdot{
  width:8px;height:8px;flex:none;border-radius:99px;background:var(--primary);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent),
             0 0 12px color-mix(in srgb, var(--primary) 70%, transparent);
  animation:pulseDot 2.4s ease-in-out infinite;
}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.82)}}

.week{margin-bottom:22px;animation:riseIn .42s cubic-bezier(.2,.7,.3,1) both}
.week-head{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:.95rem;font-weight:700;color:var(--muted)}
.week-head .n{background:var(--primary-weak);color:var(--primary);border-radius:var(--radius-sm);padding:3px 10px;font-size:.8rem}
.week-head .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.list{display:grid;gap:10px}

.row{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  box-shadow:var(--shadow),var(--glow);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  position:relative;
  animation:riseIn .4s cubic-bezier(.2,.7,.3,1) both;
  transition:transform .16s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
}
.row:hover{transform:translateX(-3px)}
.row .meta{flex:1;min-width:0}
.row .meta b{display:block;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta small{color:var(--muted);font-size:.75rem}

/* not yet opened by this person: brighter + accent edge */
.row.unread{
  background:color-mix(in srgb, var(--primary) 7%, var(--card));
  border-color:color-mix(in srgb, var(--primary) 34%, var(--border));
}
.row.unread::before{
  content:"";position:absolute;inset-block:8px;inset-inline-start:0;width:3px;
  border-radius:99px;background:var(--primary);opacity:.9;
}
.row .newdot{
  width:8px;height:8px;flex:none;border-radius:99px;background:var(--primary);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent);
  animation:pulseDot 2.4s ease-in-out infinite;
}
.acts{display:flex;gap:8px;flex-wrap:wrap}

.btn{
  border:none;border-radius:var(--radius-sm);padding:9px 14px;font-size:.85rem;font-weight:600;
  background:var(--primary);color:var(--btn-fg,#fff);display:inline-flex;align-items:center;gap:6px;
  box-shadow:var(--glow);
  transition:transform .12s ease, filter .18s ease, box-shadow .18s ease;
  text-decoration:none;
}
html[data-style="storm"] .btn{color:#171208}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.955)}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.small{padding:7px 11px;font-size:.8rem}
.btn:disabled{opacity:.55;cursor:not-allowed}

.empty{
  border:1px dashed var(--border);border-radius:var(--radius);padding:34px 16px;
  text-align:center;color:var(--muted);font-size:.92rem;background:var(--card);
  animation:riseIn .4s ease both;
}

.toast{
  position:fixed;inset-inline:0;bottom:18px;margin:0 auto;width:max-content;max-width:92%;
  background:var(--text);color:var(--card);padding:10px 16px;border-radius:var(--radius-sm);
  font-size:.85rem;font-weight:600;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
  transform:translateY(8px);
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.err{background:var(--danger);color:#fff}

dialog{border:none;padding:0;background:transparent;max-width:520px;width:calc(100% - 24px)}
dialog::backdrop{background:rgba(8,10,14,.55);backdrop-filter:blur(3px)}
.modal{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow),var(--glow);overflow:hidden;
  display:flex;flex-direction:column;max-height:92vh;
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  animation:pop .26s cubic-bezier(.2,.8,.3,1.1) both;
}
.modal header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal header h2{margin:0;font-size:1rem;flex:1}
.modal .body{padding:16px;overflow:auto}
.field{margin-bottom:14px}
.field label{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px;color:var(--muted)}
.field input,.field select{
  width:100%;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-family:inherit;font-size:.9rem;
  box-shadow:var(--glow);transition:box-shadow .2s ease, border-color .2s ease;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--primary);box-shadow:var(--ring),var(--glow)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{
  flex:1;min-width:78px;padding:9px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:transparent;color:var(--text);font-size:.85rem;font-weight:600;
  transition:transform .12s ease, background .18s ease, color .18s ease;
}
.seg button:active{transform:scale(.95)}
.seg button.on{background:var(--primary);color:var(--btn-fg,#fff);border-color:var(--primary)}
html[data-style="storm"] .seg button.on{color:#171208}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:.75rem;color:var(--muted);margin-top:6px}
.status{font-size:.8rem;color:var(--muted);margin-top:10px}
.wide{width:100%;justify-content:center}
.center{text-align:center}
.center .field{text-align:right}

.viewer{position:fixed;inset:0;z-index:60;background:rgba(8,10,14,.94);display:flex;flex-direction:column}
.viewer-top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--border)}
.viewer-top .t{flex:1;min-width:0;font-weight:700;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer-body{flex:1;overflow:auto;padding:10px}
.viewer-body iframe{width:100%;height:100%;border:0;border-radius:var(--radius-sm);background:#fff}
.viewer-tools{display:flex;gap:8px;padding:10px 14px;background:var(--card);border-top:1px solid var(--border);flex-wrap:wrap;align-items:center}
.viewer-tools .sp{flex:1}
.zoombtn{
  border:1px solid var(--border);background:transparent;color:var(--text);
  border-radius:var(--radius-sm);padding:6px 11px;font-size:.85rem;font-weight:700;min-width:38px;
  transition:transform .12s ease;
}
.zoombtn:active{transform:scale(.92)}
.closebtn{padding-inline:14px;font-weight:600;letter-spacing:.2px}

/* version tag: pinned to the bottom-left corner, independent of text direction */
#versionTag{
  position:fixed;left:14px;bottom:10px;z-index:5;
  direction:ltr;unicode-bidi:isolate;
  font-size:.72rem;font-weight:700;letter-spacing:.6px;
  color:var(--muted);opacity:.75;
  padding:4px 9px;border-radius:var(--radius-sm);
  background:color-mix(in srgb, var(--card) 70%, transparent);
  border:1px solid var(--border);
  pointer-events:none;user-select:none;
}

@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes viewIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.view-swap{animation:viewIn .3s cubic-bezier(.2,.7,.3,1) both}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
@media (max-width:560px){
  .grid{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .row{flex-wrap:wrap}
  .row .meta{flex:1 1 100%;order:1}
  .acts{order:2;width:100%}
  .viewer-top .btn span, .viewer-tools .btn span{display:none}
}
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="flash" id="flash"></div>

<header>
  <div class="wrap hbar">
    <button class="icon-btn back" id="backBtn" type="button">رجوع</button>
    <h1 id="pageTitle">المواد الدراسية</h1>
    <button class="icon-btn" id="settingsBtn" type="button">الإعدادات</button>
  </div>
</header>

<main>
  <div class="wrap" id="view"></div>
</main>

<!-- settings -->
<dialog id="setDlg">
  <div class="modal">
    <header>
      <h2>الإعدادات</h2>
      <button class="icon-btn" id="closeSet" type="button">إغلاق</button>
    </header>
    <div class="body">
      <div class="field">
        <label>ستايل الموقع</label>
        <div class="grid2" id="styleSeg">
          <button type="button" data-style-val="modern">عادي</button>
          <button type="button" data-style-val="storm">العاصفة</button>
        </div>
      </div>

      <div class="field" id="themeField">
        <label>الوضع</label>
        <div class="seg" id="themeSeg">
          <button type="button" data-theme-val="light">فاتح</button>
          <button type="button" data-theme-val="dark">داكن</button>
          <button type="button" data-theme-val="auto">تلقائي</button>
        </div>
        <div class="hint" id="themeHint"></div>
      </div>

      <hr style="border:none;border-top:1px solid var(--border);margin:6px 0 16px">
      <p class="hint" style="margin:0 0 12px;font-size:.85rem;color:var(--text)">عندك ملفات جديدة ترفعها؟</p>
      <button class="btn wide" id="openUploadDlg" type="button">رفع ملف جديد</button>
      <div class="hint" id="connStatus" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">بنفحص الاتصال...</div>
      <div class="hint" id="buildTag" style="margin-top:6px;opacity:.65"></div>
    </div>
  </div>
</dialog>

<!-- password check -->
<dialog id="passDlg">
  <div class="modal">
    <header>
      <h2>كلمة المرور</h2>
      <button class="icon-btn" id="closePass" type="button">إغلاق</button>
    </header>
    <div class="body center">
      <div class="field">
        <label>ادخل كلمة المرور</label>
        <input id="passIn" type="password" autocomplete="off" placeholder="••••••••">
      </div>
      <button class="btn wide" id="verifyBtn" type="button">تحقق</button>
      <div class="status" id="passStatus"></div>
    </div>
  </div>
</dialog>

<!-- upload panel -->
<dialog id="upDlg">
  <div class="modal">
    <header>
      <h2>رفع ملف</h2>
      <button class="icon-btn" id="closeUp" type="button">إغلاق</button>
    </header>
    <div class="body">
      <div class="field">
        <label>المادة</label>
        <select id="upSubject"></select>
      </div>
      <div class="field">
        <label>رقم الأسبوع (اختياري)</label>
        <input id="upWeek" type="number" min="0" max="52" step="1" placeholder="سيبه فاضي لو مش مرتبط بأسبوع">
        <div class="hint">لو سايبه فاضي الملف هيبقى في مجموعة «بدون تحديد أسبوع».</div>
      </div>
      <div class="field">
        <label>اسم الملف</label>
        <input id="upName" type="text" maxlength="120" placeholder="مثال: حل تمارين الأسبوع الثالث">
        <div class="hint">لو سايبها فاضي هناخد اسم الملف الأصلي.</div>
      </div>
      <div class="field">
        <label>الملف (PDF)</label>
        <input id="upFile" type="file" accept="application/pdf,.pdf">
        <div class="hint">تقدر ترفع أكتر من ملف، وكل ملف باسمه.</div>
      </div>
      <button class="btn wide" id="uploadBtn" type="button">تأكيد ورفع</button>
      <div class="status" id="upStatus"></div>
    </div>
  </div>
</dialog>

<!-- pdf viewer -->
<div class="viewer" id="viewer" style="display:none">
  <div class="viewer-top">
    <div class="t" id="viewerTitle"></div>
    <button class="zoombtn" id="zoomOut" type="button">−</button>
    <span class="hint" id="zoomLabel" style="margin:0">100%</span>
    <button class="zoombtn" id="zoomIn" type="button">+</button>
<button class="zoombtn closebtn" id="viewerClose" type="button" aria-label="إغلاق">إغلاق</button>
  </div>
  <div class="viewer-body" id="viewerFrameWrap">
    <iframe id="viewerFrame" title="عارض الملف"></iframe>
  </div>
  <div class="viewer-tools">
    <a class="btn" id="dlBtn" href="#"><span>تحميل الملف</span></a>
    <a class="btn ghost" id="openBtn" target="_blank" rel="noopener" href="#"><span>فتح في تاب جديد</span></a>
    <div class="sp"></div>
    <span class="hint" style="margin:0">لو التحميل بطيء، افتحه في تاب جديد.</span>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="versionTag"></div>

function requirePassword(cb) {
  if (authed) { cb(); return; }
  $("#passIn").value = "";
  $("#passStatus").textContent = "";
  $("#passDlg").showModal();
  const onOk = () => {
    if (checkPassword()) { authed = true; $("#passDlg").close(); cb(); }
    else $("#passStatus").textContent = "كلمة المرور غير صحيحة";
  };
  $("#verifyBtn").onclick = onOk;
  $("#passIn").onkeydown = (e) => { if (e.key === "Enter") onOk(); };
  setTimeout(() => { const p = $("#passIn"); if (p) p.focus(); }, 60);
}

/* ---------- per-device "what is new" tracking ---------- */
function getSeen() {
  let v = { visited: {}, read: {} };
  try { v = Object.assign(v, JSON.parse(localStorage.getItem(LS_SEEN) || "{}")); } catch (e) { /* fresh */ }
  if (!v.visited || typeof v.visited !== "object") v.visited = {};
  if (!v.read || typeof v.read !== "object") v.read = {};
  return v;
}
function saveSeen(v) {
  try { localStorage.setItem(LS_SEEN, JSON.stringify(v)); } catch (e) { /* ignore */ }
}
/* a file is unread until this device actually opens or downloads it */
function isUnread(r) { return !getSeen().read[r.id]; }
/* the subject card dot clears when you enter the subject, and comes back
   if anything is uploaded after that visit */
function hasNewIn(subjectId) {
  const seen = getSeen();
  const since = seen.visited[subjectId] || 0;
  return rows.some((r) => r.subject === subjectId
    && new Date(r.created_at).getTime() > since
    && !seen.read[r.id]);
}
function markVisited(subjectId) {
  const v = getSeen();
  v.visited[subjectId] = Date.now();
  saveSeen(v);
}
function markRead(id) {
  const v = getSeen();
  v.read[id] = Date.now();
  const keys = Object.keys(v.read);
  if (keys.length > 400) keys.sort((a, b) => v.read[a] - v.read[b]).slice(0, keys.length - 400).forEach((k) => { delete v.read[k]; });
  saveSeen(v);
}

/* ---------- settings ---------- */
function getSettings() {
  try { return Object.assign({ theme: "auto", style: "modern" }, JSON.parse(localStorage.getItem(LS_SETTINGS) || "{}")); }
  catch (e) { return { theme: "auto", style: "modern" }; }
}
function saveSettings(s) { localStorage.setItem(LS_SETTINGS, JSON.stringify(s)); }

const STYLES = ["modern", "storm"];

function applyLook() {
  const s = getSettings();
  const style = STYLES.indexOf(s.style) >= 0 ? s.style : "modern";
  if (s.style !== style) { s.style = style; saveSettings(s); }
  const dark = s.theme === "dark" || (s.theme === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.style = style;
  document.documentElement.dataset.theme = style === "storm" ? "dark" : (dark ? "dark" : "light");

  document.querySelectorAll("#styleSeg button").forEach((b) => b.classList.toggle("on", b.dataset.styleVal === style));
  document.querySelectorAll("#themeSeg button").forEach((b) => b.classList.toggle("on", b.dataset.themeVal === s.theme));

  const fixed = (style === "storm");
  const tf = $("#themeField");
  if (tf) tf.style.display = fixed ? "none" : "";
  const th = $("#themeHint");
  if (th) th.textContent = fixed ? "العاصفة بتفرض لونها، فمفيش حاجة تختار فاتح ولا داكن." : "";

  if (style === "storm" && !reduceMotion()) scheduleLightning();
  updateSky();
}
function initLook() {
  applyLook();
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (getSettings().theme === "auto") applyLook(); });
}

let stormTimer = null;
function scheduleLightning() {
  clearTimeout(stormTimer);
  stormTimer = setTimeout(() => {
    const f = $("#flash");
    if (f && getSettings().style === "storm") { f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); }
    scheduleLightning();
  }, 6000 + Math.random() * 9000);
}

/* ---------- starfield + falling meteors ---------- */
const sky = {
  cv: null, ctx: null, w: 0, h: 0, dpr: 1,
  bits: [], stars: [], raf: 0, last: 0, next: 0, running: false
};
function isDark() { return document.documentElement.dataset.theme === "dark"; }
function skyOn() { return !reduceMotion() && !document.hidden; }
/* colour per theme: white on dark, deep red on light so it reads */
function tone(alpha) {
  return (isDark() ? "255,255,255," : "185,28,28,") + (+alpha).toFixed(3);
}
function skySize() {
  const cv = sky.cv;
  if (!cv) return;
  sky.dpr = Math.min(window.devicePixelRatio || 1, 2);
  sky.w = window.innerWidth;
  sky.h = window.innerHeight;
  cv.width = Math.round(sky.w * sky.dpr);
  cv.height = Math.round(sky.h * sky.dpr);
  cv.style.width = sky.w + "px";
  cv.style.height = sky.h + "px";
  sky.ctx.setTransform(sky.dpr, 0, 0, sky.dpr, 0, 0);
  // density is tied to size, so rebuild when the window changes meaningfully
  if (!sky.stars.length || Math.abs(sky.w - (sky.starsW || 0)) > 60) {
    sky.starsW = sky.w;
    buildStars();
  }
}
/* ---- stars: each twinkles on its own slow rhythm ---- */
function buildStars() {
  const area = sky.w * sky.h;
  const count = Math.max(60, Math.min(220, Math.round(area / 7000)));
  sky.stars = [];
  for (let i = 0; i < count; i++) {
    sky.stars.push({
      x: Math.random() * sky.w,
      y: Math.random() * sky.h,
      r: 0.5 + Math.random() * 1.2,
      base: 0.3 + Math.random() * 0.55,
      // negative phase so they do not all blink together
      ph: Math.random() * Math.PI * 2,
      sp: 0.25 + Math.random() * 0.75,
      // seconds per brightness swell
      swell: 7 + Math.random() * 13
    });
  }
}
function drawStars(t) {
  const ctx = sky.ctx;
  for (let i = 0; i < sky.stars.length; i++) {
    const s = sky.stars[i];
    // gentle twinkle, plus a slow swell that brightens a star then lets it settle
    const twinkle = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
    const cycle = (t + s.ph * 6) / s.swell;
    const frac = cycle - Math.floor(cycle);
    let boost = 1;
    if (frac < 0.18) boost = 1 + 1.5 * (frac / 0.18);
    else if (frac < 0.42) boost = 2.5 - 1.5 * ((frac - 0.18) / 0.24);
    const a = Math.min(1, s.base * twinkle * boost);
    const r = s.r * (a > s.base * 1.4 ? 1.25 : 1);
    ctx.fillStyle = "rgba(" + (isDark() ? "255,255,255," : "120,20,20,") + (+a).toFixed(3) + ")";
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
}
function spawnMeteor() {
  // top-right -> bottom-left, matching the RTL reading direction
  const angle = 0.12 + Math.random() * 0.1;
  const speed = 150 + Math.random() * 110;
  // starts off the top-right corner
  const x = sky.w * (0.45 + Math.random() * 0.6);
  const m = {
    x: x,
    y: -40 - Math.random() * 140,
    vx: -Math.sin(angle) * speed,
    vy: Math.cos(angle) * speed,
    len: 70 + Math.random() * 90,
    w: 0.9 + Math.random() * 0.5,
    a: 0.62 + Math.random() * 0.32,
    age: 0
  };
  sky.bits.push(m);
  return m;
}
function drawSky(now) {
  const ctx = sky.ctx;
  const dt = Math.min(48, now - sky.last || 16);
  sky.last = now;
  ctx.clearRect(0, 0, sky.w, sky.h);

  drawStars(now / 1000);

  if (now >= sky.next) {
    // small clusters of 2-3, spaced close together in time and space
    const groupSize = 2 + Math.floor(Math.random() * 2);
    const head = spawnMeteor();
    for (let k = 1; k < groupSize; k++) {
      sky.bits.push(Object.assign({}, head, {
        x: head.x + (Math.random() * 260 + 40),
        y: head.y - Math.random() * 200 - 20,
        vx: head.vx * (0.86 + Math.random() * 0.22),
        vy: head.vy * (0.84 + Math.random() * 0.24),
        len: head.len * (0.8 + Math.random() * 0.3),
        age: -Math.random() * 180
      }));
    }
    // sporadic: long quiet gaps, then a burst
    sky.next = now + (Math.random() < 0.35 ? 900 + Math.random() * 1400 : 4200 + Math.random() * 6500);
  }

  ctx.lineCap = "round";
  for (let i = 0; i < sky.bits.length; i++) {
    const b = sky.bits[i];
    b.x += b.vx * dt / 1000;
    b.y += b.vy * dt / 1000;
    b.age += dt;
    // gentle fade in, long quiet drift, soft taper at the end
    const fadeIn = Math.min(1, b.age / 260);
    const fadeOut = 1 - Math.min(1, Math.max(0, b.age - 2600) / 1600);
    const life = fadeIn * fadeOut;
    if (life <= 0.02 || b.y > sky.h + 220) { sky.bits.splice(i, 1); i--; continue; }

    const len = b.len * Math.min(1, b.age / 340);
    const tailX = b.x - (b.vx / Math.hypot(b.vx, b.vy)) * len;
    const tailY = b.y - (b.vy / Math.hypot(b.vx, b.vy)) * len;

    const g = ctx.createLinearGradient(tailX, tailY, b.x, b.y);
    g.addColorStop(0, "rgba(" + tone(0) + ")");
    g.addColorStop(0.55, "rgba(" + tone(0.14 * life * b.a) + ")");
    g.addColorStop(1, "rgba(" + tone(0.62 * life * b.a) + ")");
    ctx.strokeStyle = g;
    ctx.lineWidth = b.w;
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();

    // small soft head, not a flare
    const hg = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 4);
    hg.addColorStop(0, "rgba(" + tone(0.5 * life * b.a) + ")");
    hg.addColorStop(0.4, "rgba(" + tone(0.16 * life * b.a) + ")");
    hg.addColorStop(1, "rgba(" + tone(0) + ")");
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
    ctx.fill();
  }
  sky.raf = requestAnimationFrame(drawSky);
}
function startSky() {
  if (sky.running || !sky.cv) return;
  sky.running = true;
  sky.last = performance.now();
  sky.next = sky.last + 400;
  sky.raf = requestAnimationFrame(drawSky);
}
function stopSky() {
  if (!sky.running) return;
  sky.running = false;
  cancelAnimationFrame(sky.raf);
  sky.bits.length = 0;
  if (sky.ctx) sky.ctx.clearRect(0, 0, sky.w, sky.h);
}
function updateSky() {
  if (skyOn()) { skySize(); startSky(); } else { stopSky(); }
}

let toastTimer;
function toast(msg, type) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast show" + (type ? " " + type : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = "toast"; }, 2800);
}

function publicUrl(path) { return CONFIG.supabaseUrl + "/storage/v1/object/public/" + BUCKET + "/" + path.split("/").map(encodeURIComponent).join("/"); }
function subjectName(id) { const s = SUBJECTS.find((x) => x.id === id); return s ? s.name : id; }

/* week 0 = uploaded without picking a week */
const NO_WEEK = 0;
function weekLabel(w) { return Number(w) === NO_WEEK ? "بدون تحديد أسبوع" : "أسبوع " + w; }
function fileLabel(r) { return (r && r.name && r.name.trim()) ? r.name : ("الملف " + weekLabel(r.week)); }
function fileSize(bytes) {
  if (!bytes && bytes !== 0) return "";
  if (bytes < 1024) return bytes + " بايت";
  if (bytes < 1048576) return (bytes / 1024).toFixed(0) + " كيلوبايت";
  return (bytes / 1048576).toFixed(1) + " ميجا";
}
function safeFileName(name) {
  return (name || "file.pdf").replace(/[\\/:*?"<>|]+/g, "-").slice(0, 100);
}
function downloadName(r) { return safeFileName(fileLabel(r).replace(/\.pdf$/i, "") + ".pdf"); }
function storageKeyName(name) {
  const base = (name || "").replace(/\.pdf$/i, "");
  let ascii = base.replace(/[^A-Za-z0-9._-]+/g, "-").replace(/^[^A-Za-z0-9]+/, "").replace(/[._-]+$/, "");
  if (!ascii) ascii = "file";
  return ascii.slice(0, 60) + ".pdf";
}

/* ---------- real download (fetch -> blob -> save) ---------- */
async function downloadFile(r) {
  const name = downloadName(r);
  const url = publicUrl(r.path);
  markRead(r.id);
  const dl = $("#dlBtn");
  if (dl) dl.classList.add("busy");
  toast("جاري تجهيز الملف للتحميل...");
  try {
    const res = await withTimeout(
      fetch(url, { cache: "no-store", mode: "cors" }).then((x) => { if (!x.ok) throw new Error("HTTP " + x.status); return x; }),
      45000, { error: true }
    );
    if (res && res.error) throw new Error("timeout");
    const blob = await res.blob();
    const href = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = href;
    a.download = name;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(href); a.remove(); }, 4000);
    toast("تم إرسال الملف للتحميل.");
  } catch (e) {
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    a.target = "_blank";
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => a.remove(), 2000);
    toast("فتحنا الملف في تاب جديد — احفظه منه.", "err");
  } finally {
    if (dl) dl.classList.remove("busy");
  }
}

async function loadRows() {
  const res = await withTimeout(
    sb.from("pdfs").select("id,subject,week,name,size,path,created_at").order("week", { ascending: false }).order("created_at", { ascending: false }),
    15000, { data: null, error: { message: "timeout" } }
  );
  const tag = $("#connStatus");
  if (res.error) {
    if (tag) tag.innerHTML = "<b>مفيش اتصال بسيرفر الملفات.</b> جرّب Wi-Fi بدل بيانات الموبايل، واقفِل أي VPN أو فلتر.";
    toast("تعذر تحميل الملفات", "err");
    return;
  }
  if (tag) tag.innerHTML = "<b>الاتصال بالسيرفر شغال.</b> (" + (res.data || []).length + " ملف)";
  rows = res.data || [];
}

/* ---------- rendering ---------- */
function stagger(nodes, start) {
  if (reduceMotion()) return;
  Array.prototype.forEach.call(nodes, (n, i) => { n.style.animationDelay = (start + i * 45) + "ms"; });
}

function render() {
  const view = $("#view");
  view.innerHTML = "";
  if (state.view === "home") renderHome(view); else renderSubject(view, state.subject);
  if (!reduceMotion()) { view.classList.remove("view-swap"); void view.offsetWidth; view.classList.add("view-swap"); }
}

function renderHome(view) {
  $("#pageTitle").textContent = "المواد الدراسية";
  $("#backBtn").style.display = "none";
  const total = rows.length;
  view.appendChild(el("p", "sub-title", total
    ? "اختر المادة عشان تشوف ملفاتها. النقطة جنب المادة معناها فيه ملف جديد من أول ما فتحت."
    : "اختر المادة عشان تشوف ملفاتها."));
  const grid = el("div", "grid");
  SUBJECTS.forEach((s) => {
    const c = el("button", "card");
    c.type = "button";
    c.appendChild(el("span", "dot"));
    c.appendChild(el("span", null, s.name));
    const count = rows.filter((r) => r.subject === s.id).length;
    c.appendChild(el("span", "cnt", count ? count + " ملف" : "فارغة"));
    if (hasNewIn(s.id)) {
      c.appendChild(el("span", "newdot"));
      c.setAttribute("aria-label", s.name + " — فيه ملف جديد");
    }
    c.addEventListener("click", () => { state = { view: "subject", subject: s.id }; window.scrollTo(0, 0); render(); });
    grid.appendChild(c);
  });
  stagger(grid.children, 40);
  view.appendChild(grid);
}

function renderSubject(view, id) {
  const list = rows.filter((r) => r.subject === id)
    .sort((a, b) => (b.week - a.week) || (new Date(b.created_at) - new Date(a.created_at)));
  $("#pageTitle").textContent = subjectName(id);
  $("#backBtn").style.display = "inline-flex";
  view.appendChild(el("p", "sub-title", list.length ? "الأسابيع (الأحدث فوق)." : "لسه مفيش ملفات مرفوعة للمادة دي."));

  // entering the subject clears its card dot; per-file dots stay until opened
  markVisited(id);

  if (!list.length) { view.appendChild(el("div", "empty", "مفيش ملفات هنا حاليًا. ارفع ملفات من الإعدادات.")); return; }

  const weeks = [];
  list.forEach((r) => { if (!weeks.includes(r.week)) weeks.push(r.week); });

  weeks.forEach((w) => {
    const items = list.filter((r) => r.week === w);
    const block = el("div", "week");
    const head = el("div", "week-head");
    head.appendChild(el("span", "n", weekLabel(w)));
    head.appendChild(el("span", "rule"));
    head.appendChild(el("span", null, items.length + " ملف"));
    block.appendChild(head);
    const box = el("div", "list");
    items.forEach((r) => box.appendChild(fileRow(r)));
    block.appendChild(box);
    view.appendChild(block);
  });
  stagger(view.querySelectorAll(".week, .row"), 20);
}

function fileRow(r) {
  const fresh = isUnread(r);
  const row = el("div", "row" + (fresh ? " unread" : ""));
  const meta = el("div", "meta");
  meta.appendChild(el("b", null, fileLabel(r)));
  const when = new Date(r.created_at).toLocaleDateString("ar-EG", { year: "numeric", month: "long", day: "numeric" });
  const size = r.size ? " · " + fileSize(r.size) : "";
  meta.appendChild(el("small", null, when + size));
  row.appendChild(meta);
  if (fresh) {
    const d = el("span", "newdot");
    d.title = "لسه ما فتحتهوش";
    row.appendChild(d);
  }

  const acts = el("div", "acts");
  const open = el("button", "btn small", "فتح");
  open.type = "button";
  open.addEventListener("click", () => openViewer(r));

  const dl = el("button", "btn ghost small", "تحميل");
  dl.type = "button";
  dl.addEventListener("click", () => downloadFile(r));

  const del = el("button", "btn danger small", "حذف");
  del.type = "button";
  del.addEventListener("click", () => askDelete(r));

  acts.appendChild(open); acts.appendChild(dl); acts.appendChild(del);
  row.appendChild(acts);
  return row;
}

/* ---------- pdf viewer ---------- */
function openViewer(r) {
  current = r;
  markRead(r.id);
  const url = publicUrl(r.path);
  $("#viewerTitle").textContent = subjectName(r.subject) + " — " + fileLabel(r);
  const dl = $("#dlBtn");
  dl.removeAttribute("href");
  dl.removeAttribute("download");
  dl.dataset.path = r.path;
  dl.dataset.name = downloadName(r);
  dl.style.cursor = "pointer";
  $("#openBtn").href = url;
  setZoom(100);
  $("#viewerFrame").src = url + "#view=FitH";
  $("#viewer").style.display = "flex";
  document.body.style.overflow = "hidden";
  render();
}
function closeViewer() {
  $("#viewer").style.display = "none";
  $("#viewerFrame").src = "about:blank";
  document.body.style.overflow = "";
}
function setZoom(z) {
  zoom = Math.min(200, Math.max(50, z));
  const label = $("#zoomLabel");
  if (label) label.textContent = zoom + "%";
  const wrap = $("#viewerFrameWrap");
  const frame = $("#viewerFrame");
  if (!wrap || !frame) return;
  const avail = Math.max(320, wrap.clientWidth - 24);
  frame.style.width = Math.max(320, Math.round(avail * (zoom / 100))) + "px";
  frame.style.height = "100%";
  frame.style.margin = "0 auto";
  frame.style.display = "block";
}

/* ---------- delete ---------- */
function askDelete(r) {
  requirePassword(() => {
    if (!window.confirm("حذف \"" + fileLabel(r) + "\" من " + subjectName(r.subject) + "؟")) return;
    doDelete(r);
  });
}
async function doDelete(r) {
  const res = await withTimeout(sb.from("pdfs").delete().eq("id", r.id), 20000, { error: { message: "انتهت المهلة" } });
  if (res.error) { toast("فشل الحذف: " + res.error.message, "err"); return; }
  await withTimeout(sb.storage.from(BUCKET).remove([r.path]), 20000, { error: { message: "انتهت المهلة" } });
  toast("تم الحذف");
  const v = getSeen();
  delete v.read[r.id];
  saveSeen(v);
  await loadRows();
  render();
}

/* ---------- upload ---------- */
const MAX_UPLOAD_BYTES = 70 * 1048576;
const RESUMABLE_MIN_BYTES = 6 * 1048576;
const UPLOAD_TIMEOUT_BASE = 90000;
const UPLOAD_TIMEOUT_PER_MB = 20000;
function uploadTimeoutFor(bytes) {
  const mb = (bytes || 0) / 1048576;
  return Math.min(600000, Math.round(UPLOAD_TIMEOUT_BASE + mb * UPLOAD_TIMEOUT_PER_MB));
}

function uploadHint(err) {
  const raw = ((err && err.message) || "").trim();
  const m = raw.toLowerCase();
  if (!raw) return ["الرفع فشل من غير سبب واضح.", ""];
  if (m.indexOf("fetch") >= 0 || m.indexOf("network") >= 0 || m.indexOf("load failed") >= 0)
    return ["مفيش اتصال بخادم الملفات. جرّب شبكة تانية: Wi-Fi بدل بيانات الموبايل، واقفِل أي VPN أو فلتر.", raw];
  if (m.indexOf("invaild-key") >= 0 || m.indexOf("invalid-key") >= 0 || m.indexOf("invalid key") >= 0)
    return ["اسم الملف فيه رموز مش مسموح بها. جرّب تاني من غير تغيير الاسم.", raw];
  if (m.indexOf("row-level security") >= 0)
    return ["الموقع مش مسموح له يكتب في القاعدة. اعمل تحديث للصفحة (سحب لتحت) وجرّب تاني.", raw];
  if (m.indexOf("maximum allowed size") >= 0 || m.indexOf("too large") >= 0)
    return ["الملف كبير أوي على الحد المسموح من السيرفر. صغّره وجرّب.", raw];
  if (m.indexOf("timeout") >= 0 || m.indexOf("انتهت مهلة") >= 0)
    return ["الاتصال بطيء والوقت خلص قبل ما الملف يوصل. جرّب تاني أو صغّر الملف.", raw];
  if (m.indexOf("already exists") >= 0)
    return ["فيه ملف بنفس الاسم في نفس الأسبوع. غيّر اسم الملف وجرّب.", raw];
  return ["الرفع فشل. جرّب تاني، ولو فشل برضه ابعتي الكلام اللي تحت.", raw];
}

function showUploadError(st, err) {
  const parts = uploadHint(err);
  st.innerHTML = "";
  st.appendChild(el("div", null, parts[0]));
  if (parts[1]) {
    const d = el("div", null, "تفاصيل: " + parts[1]);
    d.style.marginTop = "6px";
    d.style.fontSize = "0.72rem";
    d.style.opacity = "0.7";
    d.style.wordBreak = "break-all";
    st.appendChild(d);
  }
}

let uploadIdSeq = 0;
function nextUploadId(path) {
  uploadIdSeq += 1;
  return Math.floor(Date.now()).toString(36) + "-" + uploadIdSeq + "-" + Math.floor(Math.random() * 1e9).toString(36);
}

async function uploadWithRetry(path, file, attempts) {
  const big = (file.size || 0) >= RESUMABLE_MIN_BYTES;
  const modes = big ? [true, false] : [false];
  let last = null;
  for (const resumable of modes) {
    const uploadId = resumable ? nextUploadId(path) : null;
    for (let i = 0; i < attempts; i++) {
      const opts = { contentType: "application/pdf", upsert: true };
      if (resumable) opts.uploadId = uploadId;
      const res = await withTimeout(
        sb.storage.from(BUCKET).upload(path, file, opts),
        uploadTimeoutFor(file.size),
        { error: { message: "انتهت مهلة الرفع" } }
      );
      if (!res.error) return res;
      last = res.error;
      const m = String((last && last.message) || "").toLowerCase();
      const retriable = m.indexOf("fetch") >= 0 || m.indexOf("network") >= 0 || m.indexOf("load failed") >= 0 || m.indexOf("timeout") >= 0 || m.indexOf("انتهت مهلة") >= 0 || m.indexOf("econnreset") >= 0 || m.indexOf("socket") >= 0;
      if (!retriable) break;
      await new Promise((r) => setTimeout(r, 1200 * (i + 1)));
    }
  }
  return { error: last };
}

async function doUpload() {
  const st = $("#upStatus");
  const subject = $("#upSubject").value;
  const rawWeek = ($("#upWeek").value || "").trim();
  const week = rawWeek === "" ? NO_WEEK : Math.floor(Number(rawWeek));
  const file = $("#upFile").files[0];
  const typedName = ($("#upName").value || "").trim();
  if (!subject) { st.textContent = "اختر المادة."; return; }
  if (rawWeek !== "" && (!Number.isFinite(week) || week < 1 || week > 52)) {
    st.textContent = "رقم الأسبوع لازم يكون من 1 إلى 52، أو سيبه فاضي.";
    return;
  }
  if (!file) { st.textContent = "اختر ملف PDF."; return; }
  if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) { st.textContent = "الملف لازم يكون PDF."; return; }
  if (file.size > MAX_UPLOAD_BYTES) {
    st.textContent = "حجم الملف " + fileSize(file.size) + " وده أكبر من الحد (70 ميجا). صغّره وجرّب تاني.";
    return;
  }

  const btn = $("#uploadBtn");
  btn.disabled = true;
  st.textContent = "جاري الرفع... (" + fileSize(file.size) + ")";

  const slug = week === NO_WEEK ? "nw" : String(week);
  const path = subject + "/" + slug + "-" + Date.now() + "-" + storageKeyName(file.name);
  const label = typedName || file.name.replace(/\.pdf$/i, "");

  const up = await uploadWithRetry(path, file, 3);
  if (up.error) { showUploadError(st, up.error); btn.disabled = false; return; }

  const save = await withTimeout(
    sb.from("pdfs").insert({ subject, week, name: label, path, size: file.size }),
    20000, { error: { message: "انتهت المهلة" } }
  );
  if (save.error) { st.textContent = "الملف اترفع فعلاً بس مقدرش يتسجّل في القائمة: " + save.error.message; btn.disabled = false; return; }

  btn.disabled = false;
  $("#upFile").value = "";
  $("#upName").value = "";
  $("#upWeek").value = "";
  st.textContent = "تم الرفع: " + label;
  toast("تم رفع " + label);
  // the uploader has obviously seen their own file
  if (save.data && save.data[0]) { markVisited(subject); markRead(save.data[0].id); }
  await loadRows();
  render();
}

function init() {
  initLook();
  $("#buildTag").textContent = "إصدار الصفحة: " + BUILD;
  $("#versionTag").textContent = VERSION;

  sky.cv = $("#sky");
  sky.ctx = sky.cv ? sky.cv.getContext("2d") : null;
  updateSky();
  window.addEventListener("resize", () => { if (skyOn()) skySize(); });
  document.addEventListener("visibilitychange", updateSky);

  $("#backBtn").addEventListener("click", () => { state = { view: "home", subject: null }; window.scrollTo(0, 0); render(); });
  $("#settingsBtn").addEventListener("click", () => { applyLook(); $("#setDlg").showModal(); });
  $("#closeSet").addEventListener("click", () => $("#setDlg").close());
  $("#closePass").addEventListener("click", () => { authed = false; $("#passDlg").close(); });
  $("#closeUp").addEventListener("click", () => $("#upDlg").close());

  const pickSeg = (sel, key, attr) => {
    $(sel).addEventListener("click", (e) => {
      const b = e.target.closest("button[" + attr + "]");
      if (!b) return;
      saveSettings(Object.assign(getSettings(), { [key]: b.getAttribute(attr) }));
      applyLook();
    });
  };
  pickSeg("#styleSeg", "style", "data-style-val");
  pickSeg("#themeSeg", "theme", "data-theme-val");

  $("#openUploadDlg").addEventListener("click", () => {
    requirePassword(() => { $("#setDlg").close(); setTimeout(() => $("#upDlg").showModal(), 120); });
  });

  $("#uploadBtn").addEventListener("click", doUpload);

  $("#dlBtn").addEventListener("click", (e) => {
    e.preventDefault();
    if (!current) return;
    downloadFile(current);
  });

  $("#viewerClose").addEventListener("click", closeViewer);
  $("#zoomIn").addEventListener("click", () => setZoom(zoom + 25));
  $("#zoomOut").addEventListener("click", () => setZoom(zoom - 25));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#viewer").style.display === "flex") closeViewer(); });

  const sel = $("#upSubject");
  SUBJECTS.forEach((s) => { const o = document.createElement("option"); o.value = s.id; o.textContent = s.name; sel.appendChild(o); });

  loadRows().then(render);
  window.addEventListener("resize", () => { if ($("#viewer").style.display === "flex") setZoom(zoom); });
}
document.addEventListener("DOMContentLoaded", init);
</script>
