<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="موادك الدراسية — ملفات الأسابيع">
<link rel="icon" href="data:,">
<title>المواد الدراسية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#141821; --muted:#5d6675; --border:#e2e6ef;
  --primary:#1f6feb; --primary-weak:#e9f1ff; --danger:#d64545; --ok:#1f9254;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 10px 28px rgba(16,24,40,.07);
}
html[data-theme="dark"]{
  --bg:#0d1014; --card:#151a21; --text:#e9edf3; --muted:#96a0b0; --border:#242b35;
  --primary:#5c9cff; --primary-weak:#15243d; --danger:#ff6f6f; --ok:#3ec27f;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--border)}
.hbar{display:flex;align-items:center;gap:10px;padding:12px 0}
.hbar h1{font-size:1.05rem;margin:0;font-weight:700;flex:1;min-width:0}
.icon-btn{
  border:1px solid var(--border);background:transparent;color:var(--text);
  border-radius:10px;padding:8px 12px;font-size:.85rem;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;
}
.icon-btn:hover{background:var(--primary-weak);color:var(--primary);border-color:var(--primary)}
.back{display:none}
main{padding:20px 0 80px}
.sub-title{color:var(--muted);font-size:.9rem;margin:0 0 16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:16px;text-align:right;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:12px;width:100%;
  color:var(--text);font-size:1rem;font-weight:600;
}
.card:hover{border-color:var(--primary);transform:translateY(-1px)}
.card .dot{width:10px;height:10px;border-radius:50%;background:var(--primary);flex:none}
.card .cnt{margin-inline-start:auto;color:var(--muted);font-size:.78rem;font-weight:500}
.week{margin-bottom:22px}
.week-head{
  display:flex;align-items:center;gap:10px;margin:0 0 10px;
  font-size:.95rem;font-weight:700;color:var(--muted);
}
.week-head .n{
  background:var(--primary-weak);color:var(--primary);
  border-radius:8px;padding:3px 10px;font-size:.8rem;
}
.list{display:grid;gap:10px}
.row{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  display:flex;align-items:center;gap:12px;padding:12px 14px;box-shadow:var(--shadow);
}
.row .meta{flex:1;min-width:0}
.row .meta b{display:block;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta small{color:var(--muted);font-size:.75rem}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:none;border-radius:10px;padding:9px 14px;font-size:.85rem;font-weight:600;
  background:var(--primary);color:#fff;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.small{padding:7px 11px;font-size:.8rem}
.btn:disabled{opacity:.55;cursor:not-allowed}
.empty{
  border:1px dashed var(--border);border-radius:14px;padding:34px 16px;
  text-align:center;color:var(--muted);font-size:.92rem;background:var(--card);
}
.toast{
  position:fixed;inset-inline:0;bottom:18px;margin:0 auto;width:max-content;max-width:92%;
  background:var(--text);color:var(--card);padding:10px 16px;border-radius:10px;
  font-size:.85rem;font-weight:600;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;
}
.toast.show{opacity:1}
.toast.err{background:var(--danger);color:#fff}
dialog{border:none;padding:0;background:transparent;max-width:520px;width:calc(100% - 24px)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.modal{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;max-height:92vh;
}
.modal header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal header h2{margin:0;font-size:1rem;flex:1}
.modal .body{padding:16px;overflow:auto}
.field{margin-bottom:14px}
.field label{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px;color:var(--muted)}
.field input,.field select{
  width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-family:inherit;font-size:.9rem;
}
.field input:focus,.field select:focus{outline:2px solid var(--primary);outline-offset:1px}
.seg{display:flex;gap:8px}
.seg button{
  flex:1;padding:9px;border-radius:10px;border:1px solid var(--border);
  background:transparent;color:var(--text);font-size:.85rem;font-weight:600;
}
.seg button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.hint{font-size:.75rem;color:var(--muted);margin-top:6px}
.status{font-size:.8rem;color:var(--muted);margin-top:10px}
.wide{width:100%;justify-content:center}
.center{text-align:center}
.center .field{text-align:right}

/* pdf viewer */
.viewer{position:fixed;inset:0;z-index:60;background:rgba(8,10,14,.94);display:flex;flex-direction:column}
.viewer-top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--border)}
.viewer-top .t{flex:1;min-width:0;font-weight:700;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer-body{flex:1;overflow:auto;padding:10px}
.viewer-body iframe{width:100%;height:100%;border:0;border-radius:10px;background:#fff}
.viewer-tools{display:flex;gap:8px;padding:10px 14px;background:var(--card);border-top:1px solid var(--border);flex-wrap:wrap;align-items:center}
.viewer-tools .sp{flex:1}
.zoombtn{
  border:1px solid var(--border);background:transparent;color:var(--text);
  border-radius:8px;padding:6px 11px;font-size:.85rem;font-weight:700;min-width:38px;
}
@media (max-width:560px){
  .grid{grid-template-columns:1fr}
  .row{flex-wrap:wrap}
  .row .meta{flex:1 1 100%;order:1}
  .acts{order:2;width:100%}
  .viewer-top .btn span, .viewer-tools .btn span{display:none}
}
</style>
</head>
<body>

<header>
  <div class="wrap hbar">
    <button class="icon-btn back" id="backBtn" type="button">رجوع</button>
    <h1 id="pageTitle">المواد الدراسية</h1>
    <button class="icon-btn" id="settingsBtn" type="button">الإعدادات</button>
  </div>
</header>

<main>
  <div class="wrap" id="view"></div>
</main>

<!-- settings -->
<dialog id="setDlg">
  <div class="modal">
    <header>
      <h2>الإعدادات</h2>
      <button class="icon-btn" id="closeSet" type="button">إغلاق</button>
    </header>
    <div class="body">
      <div class="field">
        <label>مظهر الموقع</label>
        <div class="seg" id="themeSeg">
          <button type="button" data-theme-val="light">فاتح</button>
          <button type="button" data-theme-val="dark">داكن</button>
          <button type="button" data-theme-val="auto">تلقائي</button>
        </div>
      </div>
      <hr style="border:none;border-top:1px solid var(--border);margin:6px 0 16px">
      <p class="hint" style="margin:0 0 12px;font-size:.85rem;color:var(--text)">عندك ملفات جديدة ترفعها؟</p>
      <button class="btn wide" id="openUploadDlg" type="button">⬆ الرفع</button>
    </div>
  </div>
</dialog>

<!-- password check -->
<dialog id="passDlg">
  <div class="modal">
    <header>
      <h2>كلمة المرور</h2>
      <button class="icon-btn" id="closePass" type="button">إغلاق</button>
    </header>
    <div class="body center">
      <div class="field">
        <label>ادخل كلمة المرور</label>
        <input id="passIn" type="password" autocomplete="off" placeholder="••••••••">
      </div>
      <button class="btn wide" id="verifyBtn" type="button">تحقق</button>
      <div class="status" id="passStatus"></div>
    </div>
  </div>
</dialog>

<!-- upload panel -->
<dialog id="upDlg">
  <div class="modal">
    <header>
      <h2>رفع ملف</h2>
      <button class="icon-btn" id="closeUp" type="button">إغلاق</button>
    </header>
    <div class="body">
      <div class="field">
        <label>المادة</label>
        <select id="upSubject"></select>
      </div>
      <div class="field">
        <label>رقم الأسبوع</label>
        <input id="upWeek" type="number" min="1" max="52" step="1" placeholder="مثال: 3">
      </div>
      <div class="field">
        <label>اسم الملف</label>
        <input id="upName" type="text" maxlength="120" placeholder="مثال: حل تمارين الأسبوع الثالث">
        <div class="hint">لو سايبها فاضي هناخد اسم الملف الأصلي.</div>
      </div>
      <div class="field">
        <label>الملف (PDF)</label>
        <input id="upFile" type="file" accept="application/pdf,.pdf">
        <div class="hint">تقدر ترفع أكتر من ملف لنفس الأسبوع، وكل ملف باسمه.</div>
      </div>
      <button class="btn wide" id="uploadBtn" type="button">تأكيد ورفع</button>
      <div class="status" id="upStatus"></div>
    </div>
  </div>
</dialog>

<!-- pdf viewer -->
<div class="viewer" id="viewer" style="display:none">
  <div class="viewer-top">
    <div class="t" id="viewerTitle"></div>
    <button class="zoombtn" id="zoomOut" type="button">−</button>
    <span class="hint" id="zoomLabel" style="margin:0">100%</span>
    <button class="zoombtn" id="zoomIn" type="button">+</button>
    <button class="zoombtn" id="viewerClose" type="button">✕</button>
  </div>
  <div class="viewer-body" id="viewerBody">
    <iframe id="viewerFrame" title="عارض الملف"></iframe>
  </div>
  <div class="viewer-tools">
    <a class="btn" id="dlBtn" download="file.pdf" href="#"><span>تحميل الملف</span> ⬇</a>
    <a class="btn ghost" id="openBtn" target="_blank" rel="noopener" href="#"><span>فتح في تاب جديد</span> ↗</a>
    <div class="sp"></div>
    <span class="hint" style="margin:0">لو مش ظاهر، استخدم تحميل الملف.</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script>
const CONFIG = {
  supabaseUrl: "https://ahornamyujlhrtzogepy.supabase.co",
  supabaseAnonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFob3JuYW15dWpsaHJ0em9nZXB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MDYxMjgsImV4cCI6MjEwNjI4MjEyOH0.YI3C4389-LH4DH8hN_o8aOqQqRRQU4cXZRgKqRS0hk8",
  uploadPassword: "Khazft2011",
  subjects: [
    { id: "arabic",  name: "اللغة العربية" },
    { id: "religion",name: "التربية الدينية" },
    { id: "math",    name: "الرياضيات" },
    { id: "science", name: "العلوم المتكاملة" },
    { id: "logic",   name: "الفلسفة والمنطق" },
    { id: "english", name: "اللغة الإنجليزية" },
    { id: "german",  name: "اللغة الألمانية" }
  ]
};

const SUBJECTS = CONFIG.subjects;
const BUCKET = "pdfs";
const LS_SETTINGS = "matarij.settings";
const $ = (s) => document.querySelector(s);
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };

let lockChain = Promise.resolve();
function serialLock(name, timeout, fn) {
  const run = lockChain.then(() => fn());
  lockChain = run.then(() => {}, () => {});
  return run;
}
function fetchWithTimeout(input, init) {
  const opts = init || {};
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 25000);
  return fetch(input, Object.assign({}, opts, { signal: opts.signal || ctl.signal })).finally(() => clearTimeout(timer));
}
function withTimeout(promise, ms, fallback) {
  return Promise.race([promise, new Promise((resolve) => setTimeout(() => resolve(fallback), ms))]);
}

const sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey, {
  auth: { lock: serialLock },
  global: { fetch: fetchWithTimeout }
});

let rows = [];
let state = { view: "home", subject: null };
let authed = false;
let zoom = 100;
let current = null;

function getSettings() {
  try { return Object.assign({ theme: "auto" }, JSON.parse(localStorage.getItem(LS_SETTINGS) || "{}")); }
  catch (e) { return { theme: "auto" }; }
}
function saveSettings(s) { localStorage.setItem(LS_SETTINGS, JSON.stringify(s)); }

function applyTheme(t) {
  const dark = t === "dark" || (t === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.querySelectorAll("#themeSeg button").forEach((b) => b.classList.toggle("on", b.dataset.themeVal === t));
}
function initTheme() {
  applyTheme(getSettings().theme);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (getSettings().theme === "auto") applyTheme("auto"); });
}

let toastTimer;
function toast(msg, type) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast show" + (type ? " " + type : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = "toast"; }, 2800);
}

function publicUrl(path) { return CONFIG.supabaseUrl + "/storage/v1/object/public/" + BUCKET + "/" + path.split("/").map(encodeURIComponent).join("/"); }
function subjectName(id) { const s = SUBJECTS.find((x) => x.id === id); return s ? s.name : id; }
function fileLabel(r) { return (r.name && r.name.trim()) || ("الملف " + r.week); }
function fileSize(bytes) {
  if (!bytes && bytes !== 0) return "";
  if (bytes < 1024) return bytes + " بايت";
  if (bytes < 1048576) return (bytes / 1024).toFixed(0) + " كيلوبايت";
  return (bytes / 1048576).toFixed(1) + " ميجا";
}
function safeFileName(name) {
  return (name || "file.pdf").replace(/[\\/:*?"<>|]+/g, "-").slice(0, 100);
}

async function loadRows() {
  const res = await withTimeout(
    sb.from("pdfs").select("id,subject,week,name,size,path,created_at").order("week", { ascending: false }).order("created_at", { ascending: false }),
    15000, { data: null, error: { message: "timeout" } }
  );
  if (res.error) { toast("تعذر تحميل الملفات", "err"); rows = []; return; }
  rows = res.data || [];
}

/* ---------- rendering ---------- */
function render() {
  const view = $("#view");
  view.innerHTML = "";
  if (state.view === "home") renderHome(view); else renderSubject(view, state.subject);
}

function renderHome(view) {
  $("#pageTitle").textContent = "المواد الدراسية";
  $("#backBtn").style.display = "none";
  view.appendChild(el("p", "sub-title", "اختر المادة عشان تشوف ملفات الأسابيع."));
  const grid = el("div", "grid");
  SUBJECTS.forEach((s) => {
    const c = el("button", "card");
    c.type = "button";
    c.appendChild(el("span", "dot"));
    c.appendChild(el("span", null, s.name));
    const count = rows.filter((r) => r.subject === s.id).length;
    c.appendChild(el("span", "cnt", count ? count + " ملف" : "فارغة"));
    c.addEventListener("click", () => { state = { view: "subject", subject: s.id }; window.scrollTo(0, 0); render(); });
    grid.appendChild(c);
  });
  view.appendChild(grid);
}

function renderSubject(view, id) {
  const list = rows.filter((r) => r.subject === id).sort((a, b) => (b.week - a.week) || (new Date(b.created_at) - new Date(a.created_at)));
  $("#pageTitle").textContent = subjectName(id);
  $("#backBtn").style.display = "inline-flex";
  view.appendChild(el("p", "sub-title", list.length ? "الأسابيع (الأحدث فوق)." : "لسه مفيش ملفات مرفوعة للمادة دي."));

  if (!list.length) { view.appendChild(el("div", "empty", "مفيش ملفات هنا حاليًا. ارفع ملفات من الإعدادات.")); return; }

  const weeks = [];
  list.forEach((r) => { if (!weeks.includes(r.week)) weeks.push(r.week); });

  weeks.forEach((w) => {
    const items = list.filter((r) => r.week === w);
    const block = el("div", "week");
    const head = el("div", "week-head");
    head.appendChild(el("span", "n", "أسبوع " + w));
    head.appendChild(el("span", null, items.length + " ملف"));
    block.appendChild(head);
    const box = el("div", "list");
    items.forEach((r) => box.appendChild(fileRow(r)));
    block.appendChild(box);
    view.appendChild(block);
  });
}

function fileRow(r) {
  const row = el("div", "row");
  const meta = el("div", "meta");
  meta.appendChild(el("b", null, fileLabel(r)));
  const when = new Date(r.created_at).toLocaleDateString("ar-EG", { year: "numeric", month: "long", day: "numeric" });
  const size = r.size ? " · " + fileSize(r.size) : "";
  meta.appendChild(el("small", null, when + size));
  row.appendChild(meta);

  const acts = el("div", "acts");
  const open = el("button", "btn small", "فتح");
  open.type = "button";
  open.addEventListener("click", () => openViewer(r));
  const dl = el("a", "btn ghost small", "تحميل");
  dl.href = publicUrl(r.path);
  dl.download = safeFileName(fileLabel(r).replace(/\.pdf$/i, "") + ".pdf");
  const del = el("button", "btn danger small", "حذف");
  del.type = "button";
  del.addEventListener("click", () => askDelete(r));
  acts.appendChild(open); acts.appendChild(dl); acts.appendChild(del);
  row.appendChild(acts);
  return row;
}

/* ---------- pdf viewer ---------- */
function openViewer(r) {
  current = r;
  const url = publicUrl(r.path);
  $("#viewerTitle").textContent = subjectName(r.subject) + " — " + fileLabel(r);
  $("#dlBtn").href = url;
  $("#dlBtn").setAttribute("download", safeFileName(fileLabel(r).replace(/\.pdf$/i, "") + ".pdf"));
  $("#openBtn").href = url;
  setZoom(100);
  $("#viewerFrame").src = url + "#view=FitH";
  $("#viewer").style.display = "flex";
  document.body.style.overflow = "hidden";
}
function closeViewer() {
  $("#viewer").style.display = "none";
  $("#viewerFrame").src = "about:blank";
  document.body.style.overflow = "";
}
function setZoom(z) {
  zoom = Math.min(200, Math.max(50, z));
  $("#zoomLabel").textContent = zoom + "%";
  const w = Math.round(($("#viewerBody").clientWidth - 24) * (zoom / 100));
  $("#viewerFrame").style.width = Math.max(320, w) + "px";
  $("#viewerFrame").style.height = "100%";
  $("#viewerFrame").style.margin = "0 auto";
  $("#viewerFrame").style.display = "block";
}

/* ---------- password ---------- */
function checkPassword() {
  const v = $("#passIn").value;
  if (v === CONFIG.uploadPassword) { authed = true; return true; }
  return false;
}
function requirePassword(cb) {
  if (authed) { cb(); return; }
  $("#passIn").value = "";
  $("#passStatus").textContent = "";
  $("#passDlg").showModal();
  const onOk = () => { if (checkPassword()) { authed = true; $("#passDlg").close(); cb(); } else { $("#passStatus").textContent = "كلمة المرور غير صحيحة"; } };
  $("#verifyBtn").onclick = onOk;
  $("#passIn").onkeydown = (e) => { if (e.key === "Enter") onOk(); };
}

/* ---------- delete ---------- */
function askDelete(r) {
  requirePassword(() => {
    if (!window.confirm("حذف \"" + fileLabel(r) + "\" من " + subjectName(r.subject) + "؟")) return;
    doDelete(r);
  });
}
async function doDelete(r) {
  const res = await withTimeout(sb.from("pdfs").delete().eq("id", r.id), 20000, { error: { message: "انتهت المهلة" } });
  if (res.error) { toast("فشل الحذف: " + res.error.message, "err"); return; }
  await withTimeout(sb.storage.from(BUCKET).remove([r.path]), 20000, { error: { message: "انتهت المهلة" } });
  toast("تم الحذف");
  await loadRows();
  render();
}

/* ---------- upload ---------- */
async function doUpload() {
  const st = $("#upStatus");
  const subject = $("#upSubject").value;
  const week = Math.floor(Number($("#upWeek").value));
  const file = $("#upFile").files[0];
  const typedName = ($("#upName").value || "").trim();
  if (!subject) { st.textContent = "اختر المادة."; return; }
  if (!week || week < 1 || week > 52) { st.textContent = "اكتب رقم أسبوع من 1 إلى 52."; return; }
  if (!file) { st.textContent = "اختر ملف PDF."; return; }
  if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) { st.textContent = "الملف لازم يكون PDF."; return; }

  const btn = $("#uploadBtn");
  btn.disabled = true;
  st.textContent = "جاري الرفع...";

  const safe = file.name.replace(/[\\/:*?"<>|]+/g, "-");
  const path = subject + "/" + week + "-" + Date.now() + "-" + safe;
  const label = typedName || file.name.replace(/\.pdf$/i, "");

  const up = await withTimeout(
    sb.storage.from(BUCKET).upload(path, file, { contentType: "application/pdf", upsert: true }),
    90000, { error: { message: "انتهت مهلة الرفع" } }
  );
  if (up.error) { st.textContent = "فشل الرفع: " + up.error.message; btn.disabled = false; return; }

  const save = await withTimeout(
    sb.from("pdfs").insert({ subject, week, name: label, path, size: file.size }),
    20000, { error: { message: "انتهت المهلة" } }
  );
  if (save.error) { st.textContent = "فشل الحفظ: " + save.error.message; btn.disabled = false; return; }

  btn.disabled = false;
  $("#upFile").value = "";
  $("#upName").value = "";
  $("#upWeek").value = "";
  st.textContent = "تم الرفع ✅ Filename: " + label;
  toast("تم رفع " + label);
  await loadRows();
  render();
}

function init() {
  initTheme();

  $("#backBtn").addEventListener("click", () => { state = { view: "home", subject: null }; window.scrollTo(0, 0); render(); });
  $("#settingsBtn").addEventListener("click", () => { applyTheme(getSettings().theme); $("#setDlg").showModal(); });
  $("#closeSet").addEventListener("click", () => $("#setDlg").close());
  $("#closePass").addEventListener("click", () => { authed = false; $("#passDlg").close(); });
  $("#closeUp").addEventListener("click", () => $("#upDlg").close());

  $("#themeSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-theme-val]");
    if (!b) return;
    saveSettings(Object.assign(getSettings(), { theme: b.dataset.themeVal }));
    applyTheme(b.dataset.themeVal);
  });

  $("#openUploadDlg").addEventListener("click", () => {
    requirePassword(() => { $("#setDlg").close(); setTimeout(() => $("#upDlg").showModal(), 120); });
  });

  $("#uploadBtn").addEventListener("click", doUpload);

  $("#viewerClose").addEventListener("click", closeViewer);
  $("#zoomIn").addEventListener("click", () => setZoom(zoom + 25));
  $("#zoomOut").addEventListener("click", () => setZoom(zoom - 25));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#viewer").style.display === "flex") closeViewer(); });

  const sel = $("#upSubject");
  SUBJECTS.forEach((s) => { const o = document.createElement("option"); o.value = s.id; o.textContent = s.name; sel.appendChild(o); });

  loadRows().then(render);
  window.addEventListener("resize", () => { if ($("#viewer").style.display === "flex") setZoom(zoom); });
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
